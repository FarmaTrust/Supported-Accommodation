name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, sodium, intl
          tools: composer

      - name: Install dependencies
        run: |
          npm ci
          composer install --working-dir=laravel --no-dev --optimize-autoloader --no-interaction

      # The fixture is regenerated from the Node sources on every run, so a
      # change to the session, superjson, audit-hash, capability or workflow
      # format fails here rather than drifting apart in production.
      - name: Regenerate the cross-runtime fixture
        run: npx tsx laravel/tests/fixtures/make-fixture.ts > laravel/tests/fixtures/node-fixture.json
        env:
          JWT_SECRET: test-secret-value-1234567890

      - name: Check the API
        run: |
          find laravel/app laravel/routes -name '*.php' -exec php -l {} \;
          php laravel/vendor/bin/phpunit --configuration laravel/phpunit.xml

      - name: Build the client
        run: npm run build

      # public_html gets the built SPA, the rewrite rules and Laravel's public
      # entry point; the framework itself sits above the document root.
      - name: Assemble the upload
        run: |
          set -euo pipefail
          mkdir -p upload/public_html upload/laravel

          cp -r dist/public/. upload/public_html/
          cp laravel/public/index.php upload/public_html/api-index.php
          cp .deploy/public_html.htaccess upload/public_html/.htaccess

          # Everything Laravel needs at runtime, and nothing it does not: no
          # tests, no fixtures, no local environment file.
          for path in app bootstrap config routes storage vendor artisan composer.json composer.lock; do
            cp -r "laravel/$path" upload/laravel/
          done
          rm -rf upload/laravel/storage/logs/*.log

          find upload -name '.DS_Store' -delete
          echo "--- upload tree ---"
          find upload -maxdepth 2 | sort

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./upload/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # .env and uploaded evidence live on the server and are never in the
          # upload, so they must never be deleted from it either.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            laravel/storage/app/**
